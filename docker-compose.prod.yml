# ══════════════════════════════════════════════════════════════
#  PRISM — Production Docker Compose
#  All 4 services on a single EC2 instance
#
#  Usage:
#    docker compose -f docker-compose.prod.yml up -d --build
#    docker compose -f docker-compose.prod.yml ps
#    docker compose -f docker-compose.prod.yml logs -f
# ══════════════════════════════════════════════════════════════

services:

  # ── TheQuantSoft Landing Page (:4000) ──
  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    container_name: prism-landing
    restart: unless-stopped
    env_file: ./thequantsoft/.env
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - prism-net

  # ── PRISM Frontend — Next.js (:3000) ──
  #
  # NEXT_PUBLIC_* MUST be passed at BUILD time (Next.js inlines them statically
  # into the JS bundles when `next build` runs). The compose `environment:`
  # block only sets runtime container env — too late for static replacement.
  # See the matching ARG/ENV lines in Dockerfile's builder stage.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.thequantsoft.co.in
        NEXT_PUBLIC_LANDING_URL: https://thequantsoft.co.in
        NEXT_PUBLIC_LIVE_API: "false"
        NEXT_PUBLIC_STREAMING: "false"
        NEXT_PUBLIC_AUTH: "false"
        # Auth/profile feature (Supabase). The anon key is the PUBLISHABLE key —
        # public by design (it ships in the browser bundle), safe to commit here,
        # same as the API URL above. The server-side JWT secret never lives here.
        NEXT_PUBLIC_AUTH_ENABLED: "true"
        NEXT_PUBLIC_SUPABASE_URL: https://qtuetulxklviwuafgbyi.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Yoajcvv-6PmarILbbpgnBg_r8vf7M3b
    container_name: prism-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/chat', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - prism-net

  # ── PRISM Backend — FastAPI (:8000) ──
  #
  # Database is OPTIONAL. The backend runs fine without it
  # (health check + mock data only). When you add a database:
  #   1. Update ../prism-analyst-services/.env with DB_HOST, DB_PASSWORD etc.
  #   2. If using AWS RDS with SSL, uncomment the volumes section below
  #      and place global-bundle.pem in the backend repo root.
  #   3. Restart: docker compose -f docker-compose.prod.yml up -d backend
  #
  backend:
    build:
      context: ../prism-analyst-services
      dockerfile: Dockerfile
    # Tag the built image so the worker (below) reuses it instead of building a
    # second time — they're the same code, just a different entrypoint.
    image: prism-backend:latest
    container_name: prism-backend
    restart: unless-stopped
    env_file: ../prism-analyst-services/.env
    ports:
      - "8000:8000"
    # ── Uncomment when database with SSL is configured ──
    # volumes:
    #   - ../prism-analyst-services/global-bundle.pem:/app/global-bundle.pem:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - prism-net

  # ── PRISM Backtest Worker (no ports) ──
  #
  # Durable backtest jobs (pb_backtests) are claimed and run here, NOT in the
  # web process — the API only enqueues. Same image as `backend` (reused via the
  # `prism-backend:latest` tag, so no second build), different entrypoint. Reads
  # the same env (primary DB for the job queue + investment RDS for prices). If
  # this service isn't running, submitted backtests stay `queued` forever.
  # Restart-safe: it reclaims stale RUNNING jobs on startup and claims work with
  # FOR UPDATE SKIP LOCKED, so multiple replicas are safe.
  worker:
    image: prism-backend:latest
    container_name: prism-worker
    restart: unless-stopped
    env_file: ../prism-analyst-services/.env
    command: ["python", "-m", "src.portfolio.worker"]
    # ── Uncomment alongside backend when DB SSL uses a CA bundle ──
    # volumes:
    #   - ../prism-analyst-services/global-bundle.pem:/app/global-bundle.pem:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - prism-net

  # ── Nginx Reverse Proxy (:80/:443) ──
  #
  # `command` runs nginx in the foreground AND a background loop that issues a
  # once-daily `nginx -s reload`. That reload is what makes auto-renewed TLS
  # certs take effect: certbot (below) writes fresh certs to the shared
  # /etc/letsencrypt volume, but nginx only re-reads cert files on reload —
  # without it, nginx keeps serving the in-memory cert until the next deploy.
  # `nginx -s reload` is a near-instant, zero-downtime graceful reload (NOT an
  # expiry check); once a day is ample since renewal happens 30 days before
  # expiry, so a renewed cert is live within ≤24h.
  nginx:
    image: nginx:alpine
    container_name: prism-nginx
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 24h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      landing:
        condition: service_started
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - prism-net

  # ── Certbot — automatic Let's Encrypt renewal (no ports) ──
  #
  # Runs `certbot renew` once a day. certbot is a no-op until a cert is within 30
  # days of expiry, then it renews via the HTTP-01 **webroot** challenge:
  #   - it writes the ACME token under ./certbot/www (shared with nginx),
  #   - nginx already serves /.well-known/acme-challenge/ from that path on :80
  #     for every domain (see nginx.conf), so Let's Encrypt validates it,
  #   - the renewed cert lands in the shared /etc/letsencrypt volume,
  #   - nginx picks it up on its next 6h reload (above).
  #
  # `--webroot -w /var/www/certbot` on the command line OVERRIDES each cert's
  # stored authenticator for this run. This is deliberate: the certs were first
  # issued with `--standalone` (which can't bind :80 while nginx holds it — the
  # reason auto-renewal was failing). Forcing webroot here fixes that without a
  # manual re-issue. See docs/TLS_CERTS.md to make the switch permanent in the
  # renewal config and for first-issue / disaster-recovery steps.
  certbot:
    image: certbot/certbot:latest
    container_name: prism-certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      nginx:
        condition: service_started
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 24h & wait $${!}; done'"
    networks:
      - prism-net

  # ── Cert-monitor — daily expiry email alarm (no ports) ──
  #
  # Safety net AROUND certbot: once a day it reads the cert nginx serves for each
  # host and emails (reusing the landing page's Gmail SMTP creds) if any cert is
  # within CERT_ALERT_DAYS (5) of expiry — repeating daily until fixed. Under
  # healthy auto-renewal certs never drop below ~30 days, so no email == healthy;
  # an email means renewal is stuck (the failure that expired prism's cert). It
  # connects to the nginx service over the compose network (SNI per host), so it
  # reflects exactly what's served and dodges NAT hairpin. See scripts/
  # cert_expiry_alert.py + docs/TLS_CERTS.md.
  cert-monitor:
    image: python:3.12-alpine
    container_name: prism-cert-monitor
    restart: unless-stopped
    env_file: ./thequantsoft/.env      # SMTP_USER / SMTP_PASS / TARGET_EMAIL
    environment:
      CERT_ALERT_DAYS: "5"
      CERT_ALERT_HOSTS: "thequantsoft.co.in,prism.thequantsoft.co.in,api.thequantsoft.co.in"
      CERT_ALERT_CONNECT_HOST: "nginx"
      CERT_ALERT_INTERVAL_SEC: "86400"
    volumes:
      - ./scripts/cert_expiry_alert.py:/app/cert_expiry_alert.py:ro
    command: ["python", "-u", "/app/cert_expiry_alert.py"]
    depends_on:
      nginx:
        condition: service_started
    networks:
      - prism-net

networks:
  prism-net:
    driver: bridge
